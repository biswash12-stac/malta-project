name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the workflow only checks code, it never writes to the repo.
# Actions are pinned to full commit SHAs (verified with the GitHub API on 2026-11-13), so a moved
# tag can't change what runs. Update the SHA and the version comment together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep the in-memory MongoDB download outside node_modules, so it can be cached between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      # Tests set their own values and use in-memory MongoDB. No secrets or real services are needed.
      - name: Type check
        run: npx tsc --noEmit
      - name: node:test suite
        run: npm test
      - name: Jest and Supertest suite
        run: npm run test:jest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
